<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داشبورد شخصی ساده</title>
<meta name="theme-color" content="#14122e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #14122e; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #14122e;

<body>
<div id="splash"><img src="icon-512.png" alt=""></div>

        allow="clipboard-write; clipboard-read"></iframe>
<script>
  document.getElementById('app').addEventListener('load', function () {
    setTimeout(function () { document.getElementById('splash').style.opacity = 0; }, 800);
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
